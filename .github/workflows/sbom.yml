name: SBOM

on:
  push:
    branches: [main]

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: server
          - name: fe
          - name: fe2
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Git SHA Short
        id: sha
        run: |
          GIT_SHA="${{ github.sha }}"
          GIT_SHA_SHORT="${GIT_SHA:0:7}"
          echo "GIT_SHA_SHORT=${GIT_SHA_SHORT}" >> "${GITHUB_OUTPUT}"

      - name: Generate source SBOMs
        run: |
          mkdir -p sbom
          syft dir:./${{ matrix.name }} -o spdx-json > "sbom/${{ matrix.name }}-source-${{ steps.sha.outputs.GIT_SHA_SHORT }}.spdx.json"

      - name: Build Docker images
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.name }}
          push: false
          load: true # load: true is required to get the digest from the buildx image
          tags: ${{ matrix.name }}:latest # tags is required to get the digest from the buildx image

      # Scan the image loaded on the runner (server:latest). name@digest often is not
      # resolvable locally and Syft falls back to pulling docker.io/library/server.
      - name: Generate image SBOMs
        run: |
          IMAGE="${{ matrix.name }}:latest"
          DIGEST="${{ steps.build.outputs.digest }}"
          if [ -z "${DIGEST}" ]; then
            echo "::error::build digest is empty; check build-push-action load/tags"
            exit 1
          fi
          if ! docker image inspect "${IMAGE}" >/dev/null 2>&1; then
            echo "::error::local image ${IMAGE} not found after build"
            docker images
            exit 1
          fi
          syft "docker:${IMAGE}" -o spdx-json > "sbom/${{ matrix.name }}-image-${{ steps.sha.outputs.GIT_SHA_SHORT }}.spdx.json"

      - name: Upload SPDX SBOM artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sbom-${{ matrix.name }}-${{ steps.sha.outputs.GIT_SHA_SHORT }}-spdx
          path: sbom/${{ matrix.name }}-*.spdx.json
          retention-days: 90
