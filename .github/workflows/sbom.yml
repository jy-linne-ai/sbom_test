name: SBOM

on:
  push:
    branches: [main]

jobs:
  generate-sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: server

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install frontend dependencies
        run: |
          npm ci --prefix fe
          pnpm install --frozen-lockfile --dir fe2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate source SBOMs
        run: |
          mkdir -p sbom
          GIT_SHA="${{ github.sha }}"
          GIT_SHA_SHORT="${GIT_SHA:0:7}"
          syft dir:./server -o cyclonedx-json > "sbom/server-source-${GIT_SHA_SHORT}.cdx.json"
          syft dir:./fe -o cyclonedx-json > "sbom/fe-source-${GIT_SHA_SHORT}.cdx.json"
          syft dir:./fe2 -o cyclonedx-json > "sbom/fe2-source-${GIT_SHA_SHORT}.cdx.json"

      - name: Build Docker images
        run: docker compose build

      - name: Generate image SBOMs
        run: |
          GIT_SHA="${{ github.sha }}"
          GIT_SHA_SHORT="${GIT_SHA:0:7}"
          syft sbom_test-server:latest -o cyclonedx-json > "sbom/server-image-${GIT_SHA_SHORT}.cdx.json"
          syft sbom_test-fe:latest -o cyclonedx-json > "sbom/fe-image-${GIT_SHA_SHORT}.cdx.json"
          syft sbom_test-fe2:latest -o cyclonedx-json > "sbom/fe2-image-${GIT_SHA_SHORT}.cdx.json"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom/*.cdx.json
          retention-days: 90
