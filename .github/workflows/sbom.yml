name: SBOM

on:
  push:
    branches: [main]

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        target:
          - name: server
          - name: fe
          - name: fe2
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Git SHA Short
        id: sha
        run: |
          GIT_SHA="${{ github.sha }}"
          GIT_SHA_SHORT="${GIT_SHA:0:7}"
          echo "GIT_SHA_SHORT=${GIT_SHA_SHORT}" >> "${GITHUB_OUTPUT}"

      - name: Generate source SBOMs
        run: |
          mkdir -p sbom
          syft dir:./${{ matrix.target.name }} -o spdx-json > "sbom/${{ matrix.target.name }}-source-${{ steps.sha.outputs.GIT_SHA_SHORT }}.spdx.json"

      - name: Build Docker images
        run: docker build -t ${{ matrix.target.name }}:latest -f ${{ matrix.target.name }}/Dockerfile ${{ matrix.target.name }}

      - name: Generate image SBOMs
        run: |
          syft ${{ matrix.target.name }}:latest -o spdx-json > "sbom/${{ matrix.target.name }}-image-${{ steps.sha.outputs.GIT_SHA_SHORT }}.spdx.json"

      - name: Upload SPDX SBOM artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sbom-${{ matrix.target.name }}-${{ steps.sha.outputs.GIT_SHA_SHORT }}-spdx
          path: sbom/${{ matrix.target.name }}-*.spdx.json
          retention-days: 90
